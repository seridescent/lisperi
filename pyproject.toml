[project]
name = "lisperi"
version = "0.1.0"
description = "barebones parser for RC pairing iteration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
lisperi = "lisperi.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lisperi"]
